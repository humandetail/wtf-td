<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>循环圈 3D 同屏测试</title>
<style>
  body{max-width:980px;margin:16px auto;padding:0 12px;background:#101e18;color:#f2ecda;font:16px system-ui}
  h1{font-size:1.35rem}
  #map{position:relative;isolation:isolate;aspect-ratio:8/5;background:#0d1813}
  #map canvas{display:block;width:100%;height:100%}
  #map #battle{position:relative;z-index:1;touch-action:none}
  #map .loop-webgl{position:absolute;inset:0;pointer-events:none}
  #controls{position:absolute;z-index:2;top:8px;right:8px}
  button{min-height:44px}
  form{display:grid;gap:8px;margin:14px 0}
  output{display:block}
</style>
<h1>循环圈 3D 同屏测试</h1>
<div id="map">
  <canvas id="battle" width="1280" height="800" aria-label="59 个敌人的循环圈性能场景"></canvas>
  <div id="controls" hidden>
    <button type="button" data-camera="lower" aria-label="降低俯角">−</button>
    <button type="button" data-camera="higher" aria-label="提高俯角">+</button>
    <button type="button" data-camera="reset">重置视角</button>
  </div>
</div>
<form id="fixture">
  <label for="model">选择四糸乃模型和两张贴图</label>
  <input id="model" type="file" accept=".mdx,.blp" multiple>
  <button id="start" disabled>开始 120 秒测试</button>
</form>
<output id="result" role="status">正在载入 3D 战场…</output>
<script type="module" src="./stress.js"></script>
</html>
